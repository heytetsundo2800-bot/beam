<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>BEAM — かざして、渡す。</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="渡したいURLをかざすだけで相手に届ける。ライブ会場・学校で、その場でホームページを手渡しするためのアプリ。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BEAM">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<!-- ==================== ホーム ==================== -->
<main id="home" class="screen">

  <header class="head">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="34" height="34">
        <circle cx="24" cy="24" r="4.2" fill="currentColor"/>
        <path d="M32.5 15.5a12 12 0 0 1 0 17M38.5 9.5a20.5 20.5 0 0 1 0 29" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M15.5 15.5a12 12 0 0 0 0 17M9.5 9.5a20.5 20.5 0 0 0 0 29" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="wordmark">BEAM</h1>
    <p class="tagline">かざして、渡す。</p>
  </header>

  <section class="list" id="list" aria-label="セット一覧"></section>

  <button class="add-btn" id="addBtn" type="button">
    <span class="add-plus">＋</span> セットを追加
  </button>

  <p class="hint" id="installHint" hidden>
    <strong>ホーム画面に追加</strong>すると、アプリとして一瞬で開けます。<br>
    <span class="hint-sub">Safariの共有ボタン<svg class="glyph" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 3v12M12 3l-3.5 3.5M12 3l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 13v5.5A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>→「ホーム画面に追加」</span>
    <button class="hint-x" id="hintClose" type="button" aria-label="閉じる">✕</button>
  </p>

  <footer class="foot">
    <span>BEAM</span>
    <span class="dot">·</span>
    <span id="verLabel">v1.0</span>
  </footer>
</main>


<!-- ==================== かざす画面 ==================== -->
<div id="beamer" class="beamer" hidden>
  <button class="beamer-close" id="beamerClose" type="button" aria-label="閉じる">✕</button>

  <div class="beamer-inner">
    <p class="beamer-lead">相手のカメラに向けてください</p>
    <h2 class="beamer-name" id="beamerName"></h2>

    <div class="qr-frame">
      <canvas id="qr" class="qr"></canvas>
    </div>

    <p class="beamer-url" id="beamerUrl"></p>
  </div>

  <div class="beamer-actions">
    <button class="btn btn-primary" id="shareBtn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v13M12 3l-4 4M12 3l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      共有（AirDrop・LINEなど）
    </button>
    <p class="beamer-note">iPhone同士なら、共有 →「AirDrop」でも渡せます</p>
  </div>
</div>


<!-- ==================== 追加／編集シート ==================== -->
<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <form class="sheet" id="sheetForm" novalidate>
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 class="sheet-title" id="sheetTitle">セットを追加</h2>

    <label class="field">
      <span class="field-label">名前</span>
      <input type="text" id="fName" placeholder="例：ROCKETs 公式サイト" autocomplete="off" enterkeyhint="next" maxlength="40">
    </label>

    <label class="field">
      <span class="field-label">URL</span>
      <input type="url" id="fUrl" placeholder="例：rockets-band.vercel.app" autocomplete="off" inputmode="url" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    </label>

    <label class="field">
      <span class="field-label">補足<span class="field-opt">任意</span></span>
      <input type="text" id="fNote" placeholder="例：ライブ情報はここ" autocomplete="off" maxlength="40">
    </label>

    <p class="field-error" id="fError" hidden></p>

    <div class="sheet-actions">
      <button type="submit" class="btn btn-primary" id="saveBtn">保存する</button>
      <button type="button" class="btn btn-ghost" id="cancelBtn">キャンセル</button>
      <button type="button" class="btn btn-danger" id="deleteBtn" hidden>このセットを削除</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>

<script src="./vendor/qrcode.js"></script>
<script src="./sets.js"></script>
<script src="./app.js"></script>
</body>
</html>
